name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: conduit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Client typecheck
        run: pnpm --filter client lint

      - name: Client production build
        run: pnpm --filter client build

      - name: Server tests
        run: pnpm --filter server test

      - name: Server production build
        run: pnpm --filter server build

  contracts-ci:
    name: Contracts Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run contract tests
        run: cargo test --manifest-path contracts/Cargo.toml

  deploy-client:
    name: Deploy Client
    runs-on: ubuntu-latest
    needs: [ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.CLIENT_DEPLOY_HOOK_URL != ''
    steps:
      - name: Trigger client deploy hook
        run: curl -fsS -X POST "${{ secrets.CLIENT_DEPLOY_HOOK_URL }}"

  deploy-server:
    name: Deploy Server
    runs-on: ubuntu-latest
    needs: [ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.SERVER_DEPLOY_HOOK_URL != ''
    steps:
      - name: Trigger server deploy hook
        run: curl -fsS -X POST "${{ secrets.SERVER_DEPLOY_HOOK_URL }}"
