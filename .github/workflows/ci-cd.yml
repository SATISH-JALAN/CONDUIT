name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: conduit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Quality Checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: conduit
          POSTGRES_PASSWORD: conduit_dev
          POSTGRES_DB: conduit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U conduit"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://conduit:conduit_dev@127.0.0.1:5432/conduit
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Push server test schema
        run: pnpm --filter server exec drizzle-kit push --force --config=drizzle.config.ts

      - name: Client typecheck
        run: pnpm --filter client lint

      - name: Client production build
        run: pnpm --filter client build

      - name: Server tests
        run: pnpm --filter server test

      - name: Server production build
        run: pnpm --filter server build

  contracts-ci:
    name: Contracts Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run contract tests
        run: cargo test --manifest-path contracts/Cargo.toml

  deploy-client:
    name: Deploy Client
    runs-on: ubuntu-latest
    needs: [ci]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Trigger client deploy hook
        env:
          CLIENT_DEPLOY_HOOK_URL: ${{ secrets.CLIENT_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "${CLIENT_DEPLOY_HOOK_URL}" ]; then
            echo "CLIENT_DEPLOY_HOOK_URL is not configured. Skipping deploy."
            exit 0
          fi
          curl -fsS -X POST "${CLIENT_DEPLOY_HOOK_URL}"

  deploy-server:
    name: Deploy Server
    runs-on: ubuntu-latest
    needs: [ci]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Trigger server deploy hook
        env:
          SERVER_DEPLOY_HOOK_URL: ${{ secrets.SERVER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "${SERVER_DEPLOY_HOOK_URL}" ]; then
            echo "SERVER_DEPLOY_HOOK_URL is not configured. Skipping deploy."
            exit 0
          fi
          curl -fsS -X POST "${SERVER_DEPLOY_HOOK_URL}"
